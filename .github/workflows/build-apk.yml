name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShopeeDriverAssistant-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: v1.0.2
          name: "Shopee Driver Assistant v1.0.2 (Device App Picker & Motorcycle Navigation)"
          make_latest: true
          body: |
            ### 🚀 Shopee Driver Assistant v1.0.2 (Huawei Nova 5T)
            
            Isang Android Assistant app para sa Shopee Food at SPX riders (Honda Click 125 V4):
            - **Device App Picker:** Binabasa ang totoong apps mula sa Huawei Nova 5T kasama ang totoong app icons
            - **Permissions Pre-Check Guard:** Sinisigurong naka-ON muna ang Accessibility at Overlay bago mamili ng target app
            - **Motorcycle Mode para sa Google Maps:** Dalawang gulong / motor navigation (`mode=l`) para sa Honda Click 125 V4
            - **Mismong Shopee Screen Tester:** Walang home exit, coordinate tap fallback para sa Availability, Incentives, Settings, at Accept
            - **Live Real-Time Logs Console:** Size evaluation (Maliit vs Malake/Mahaba) at Geofence check
            - **Location Controls:** Manila to Manila (Allow) vs Manila to Tondo (Zero-Click Ban)
            - **Shopee Availability Live Sync:** Nag-o-off ang auto-click kapag offline sa Shopee drawer
            - **Stylized "A" App Icon:** Puting background para sa Huawei Nova 5T
            
            #### 📲 Paano I-install:
            1. I-download ang **app-debug.apk** sa ibaba sa iyong Huawei Nova 5T o buksan ang na-push na APK sa iyong Downloads folder.
            2. Buksan ang **Files** app > **Downloads** at i-tap ang APK para i-install.
            3. I-allow ang *Install Unknown Apps*.
            4. I-ON ang *Accessibility Service* at *Draw Over Other Apps*.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
