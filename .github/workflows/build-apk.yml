name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShopeeDriverAssistant-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: v1.0.3
          name: "Shopee Driver Assistant v1.0.3 (Smart Availability Sync & Floating Controller)"
          make_latest: true
          body: |
            ### 🚀 Shopee Driver Assistant v1.0.3 (Huawei Nova 5T)
            
            Pinakabagong update para sa Shopee Food at SPX riders:
            - **Smart Live Availability Sync:** Awtomatikong nade-detect ang Availability toggle sa drawer AT sa main dashboard
            - **Floating HUD Quick Tester:** Mini controller sa ibabaw ng mismong Shopee screen para i-test ang Availability, Settings, Incentives, at Swipe Accept
            - **Seamless App Launch on Test:** Kapag pinindot ang Test sa loob ng app, awtomatikong bubuksan ang Shopee bago i-dispatch ang click
            - **Smooth Scrollable Logs Console:** Hindi na nahaharang ng parent scroll; makakapag-swipe pataas at pababa sa buong log history
            - **Auto-Detect App on Launch:** Awtomatikong hinahanap at ikinakabit ang tamang Shopee Driver package nang walang sobrang pindot
            - **Non-restrictive Dynamic Accessibility:** Inalis ang static package filter para basahin nang live ang bawat window ng Shopee app
            - **Shopee Availability Live Sync:** Nag-o-off ang auto-click kapag offline sa Shopee drawer
            - **Stylized "A" App Icon:** Puting background para sa Huawei Nova 5T
            
            #### 📲 Paano I-install:
            1. I-download ang **app-debug.apk** sa ibaba sa iyong Huawei Nova 5T o buksan ang na-push na APK sa iyong Downloads folder.
            2. Buksan ang **Files** app > **Downloads** at i-tap ang APK para i-install.
            3. I-allow ang *Install Unknown Apps*.
            4. I-ON ang *Accessibility Service* at *Draw Over Other Apps*.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
